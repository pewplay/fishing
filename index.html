<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fishing Game</title>
  <meta name="description" content="Hold to raise the catch zone, keep the fish inside it and fill the meter to land it.">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="app" id="app">

  <!-- Stats panel (top bar in portrait, left column in landscape) -->
  <div class="panel panel-stats">
    <h1 class="title">Fishing Game</h1>
    <div class="stats">
      <div class="stat">
        <span class="stat-label">Landed</span>
        <span class="stat-value" id="stat-caught">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Time</span>
        <span class="stat-value" id="stat-time">0.0s</span>
      </div>
      <div class="stat">
        <span class="stat-label">Best</span>
        <span class="stat-value" id="stat-best">&ndash;</span>
      </div>
    </div>
  </div>

  <!-- The fishing scene, scaled to fill the available height -->
  <div class="stage-wrap" id="stage-wrap">
    <div class="stage" id="stage">
      <div class="game">

        <div class="fishing-rod">
          <img class="fill-container" src="game-fishing-rod.svg" alt="" draggable="false">
          <canvas class="reel-line-tension" data-element="reel-line-tension"></canvas>
          <div class="reel-handle">
            <img src="game-reel-handle.svg" alt="" draggable="false">
          </div>
          <div class="reel-line"></div>
        </div>

        <div class="game-body">
          <img class="fill-container" src="game-game-body-bg.svg" alt="" draggable="false">
          <canvas class="bubbles" data-element="bubbles"></canvas>
          <canvas class="seaweed" data-element="seaweed"></canvas>
          <img class="seafloor fill-container" src="game-sea-floor.svg" alt="" draggable="false">
          <div class="fish">
            <img src="game-fish.svg" alt="" draggable="false">
          </div>
          <div class="indicator">
            <img src="game-indicator.svg" alt="" draggable="false">
          </div>
          <img class="glass fill-container" src="game-glass.svg" alt="" draggable="false">
        </div>

        <div class="progress-bar">
          <img class="fill-container" src="game-progress-bar-bg.svg" alt="" draggable="false">
          <div class="progress-gradient-wrapper">
            <img src="game-progress-gradient.svg" class="progress-gradient" alt="" draggable="false">
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Hint panel (bottom bar in portrait, right column in landscape) -->
  <div class="panel panel-hint">
    <p class="hint" id="hint">
      <span class="hint-touch">Touch and hold anywhere</span>
      <span class="hint-mouse">Hold the mouse button or any key</span>
      to lift the catch zone. Keep the fish inside it to fill the meter.
    </p>
  </div>

</div>

<!-- Success banner -->
<div class="success" id="success" aria-live="polite">
  <img src="game-nice-catch.png" alt="Nice catch!" class="nice-catch" draggable="false">
  <img src="game-perfect.png" alt="Perfect!" class="perfect" draggable="false">
  <p class="success-text" id="success-text"></p>
  <button type="button" class="again" id="again">Fish again</button>
</div>

<script src="./script.js"></script>
</body>
</html>
